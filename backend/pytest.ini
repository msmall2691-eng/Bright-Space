[pytest]
addopts = -q -p no:cacheprovider
# CI runs this curated, vetted-green set. Two flavours coexist here:
#   - Files under tests/ share fixtures via tests/conftest.py (schema-per-
#     session + auto API-key injection) and are the default place for new tests.
#   - A handful of root-level scripts (test_auth_middleware / test_complete_workflow
#     / test_phone_tail / test_quotes_integer) intentionally sit outside tests/
#     to bypass the auth autouse fixture, and are enumerated below.
#
# test_placeholder_absorption.py runs green but as a SEPARATE invocation because
# it bootstraps its own DB at import and can't share a process cleanly.
#
# Older E2E / workflow scripts that don't play with the shared fixtures moved
# to scripts/manual_tests/ — see the README there. Add new shareable test files
# under tests/, not here.
testpaths =
    test_auth_middleware.py
    test_complete_workflow.py
    test_phone_tail.py
    test_quotes_integer.py
    tests/test_activity_logger.py
    tests/test_calendar_date_fallback.py
    tests/test_client_import.py
    tests/test_gcal_notifications.py
    tests/test_gcal_sync_idempotent.py
    tests/test_gcal_synctoken.py
    tests/test_gcal_watch.py
    tests/test_tenancy_org_id.py
    tests/test_tenancy_scope_clients.py
    tests/test_cors_origins.py
    tests/test_tenancy_scope_properties.py
    tests/test_tenancy_scope_jobs.py
    tests/test_tenancy_scope_quotes.py
    tests/test_tenancy_scope_remaining.py
    tests/test_tenancy_rls.py
    tests/test_tenancy_rls_postgres.py
    tests/test_tenancy_mt4.py
    tests/test_saved_views.py
    tests/test_opportunity_detail.py
    tests/test_job_quote_detail.py
    tests/test_invoice_detail.py
    tests/test_pipeline_opportunities.py
    tests/test_ical_cancellation.py
    tests/test_ical_sync_str_fix.py
    tests/test_ical_to_gcal.py
    tests/test_normalize_properties.py
    tests/test_property_custom_fields.py
    tests/test_recurring_daily.py
    tests/test_cancel_removes_from_schedule.py
    tests/test_schema_drift.py
    tests/test_recurrence_phase0.py
    tests/test_recurrence_phase1.py
    tests/test_recurrence_phase3_endpoint.py
    tests/test_quote_send.py
    tests/test_quote_date_drift.py
    tests/test_quote_to_job_link.py
    tests/test_quote_experience.py
    tests/test_quote_self_schedule.py
    tests/test_quote_cleanup.py
    tests/test_quote_responses.py
    tests/test_intake_to_quote.py
    tests/test_intake_canonical_estimate.py
    tests/test_intake_fidelity.py
    tests/test_canonical_contacts.py
    # Twenty-style inbox model: inbound requests create no client/property until
    # staff convert; conversion + create_property dedup against existing records
    # (incl. org-scoping and no-address handling); property-merge grouping.
    tests/test_request_inbox_dedup.py
    tests/test_crm_part_c.py
    tests/test_invoice_by_service.py
    tests/test_rehydrate_dates.py
    tests/test_turnover_coverage_tick.py
    tests/test_visit_model.py
    tests/test_visit_pre_materialization.py
    tests/test_integration_events.py
    tests/test_quote_followups.py
    tests/test_today_visits.py
    tests/test_client_notes.py
    tests/test_gcal_sync_status.py
    tests/test_job_completion.py
    tests/test_customer_invite.py
    tests/test_dashboard_summary.py
    # Ops Board aggregate: GET /api/dashboard/board shape + stat-tile deltas
    # (unassigned/overdue/leads/waiting) from seeded rows.
    tests/test_dashboard_board.py
    # Tidy Up: retroactive duplicate detection + safe client merge (FK reassign)
    tests/test_cleanup.py
    # Invoice numbering: auto-created invoices get a number (no "Invoice None")
    # + org_id, and numbering is PK-derived (race-free), not max(id)+1.
    tests/test_invoice_numbering.py
    # Employee roster (staff PII) is role-gated — cleaner/client can't pull it.
    tests/test_dispatch_scope.py
    # Recurring generation runs the availability guards: a busy cleaner is
    # dropped from that occurrence (created unassigned), not double-booked.
    tests/test_recurring_conflict_guard.py
    tests/test_schedule_week.py
    tests/test_email_filter.py
    tests/test_source_canonicalization.py
    tests/test_crm_health.py
    # Owner Dashboard + T-04 SMS + T-03 dunning + booking email — all added
    # in PRs #518-#523. Codex review on #523 caught that these were being
    # silently skipped by CI because CI runs `python -m pytest` bare and
    # discovers only this curated list. Adding them here so the guarantees
    # (close-rate cohort, MRR cadence, dunning idempotency, SMS gating
    # semantics, ISO-date-not-leaked-in-subject) are actually enforced.
    tests/test_dashboard_owner.py
    tests/test_sms_reminders_gating.py
    tests/test_invoice_dunning.py
    tests/test_booking_email_service.py
    # 502 root-cause fix: SMTP / IMAP / Twilio timeout guarantees +
    # multi-worker scheduler singleton lock (Codex P1 on #525)
    tests/test_external_timeouts.py
    tests/test_scheduler_singleton.py
    # T-23: paginate + cap /api/jobs (502 spec Fix 2)
    tests/test_get_jobs_pagination.py
    # July-2026 audit L1/L3: combine_address dedup helper (PR #527). Was
    # never added here, so CI silently skipped it since merge — same class
    # of gap the #523 comment above already warned about.
    tests/test_address_util.py
    # July-2026 audit: Twilio inbound SMS webhook must fail closed when
    # TWILIO_AUTH_TOKEN is unset (was accepting unsigned/forged requests).
    tests/test_twilio_webhook_signature.py
    # July-2026 audit M1 follow-up: a returning customer's new service
    # address must attach as a Property (not just overwrite the client's
    # single primary address); plus the advisory-lock contact-serialization
    # backstop and the activity-dedup guard covering the same race class.
    tests/test_intake_property_and_contact_lock.py
    # Tenant-isolation audit: job action endpoints (complete/skip/invite-client/
    # auto-assign/crew-suggestions/reminder-settings), client GCal timeline, and
    # cleaner time-off CRUD were unscoped by org_id (cross-tenant IDOR).
    tests/test_tenancy_scope_job_actions.py
    # Recurrence Jobber-parity fixes: series split ("this and all future"),
    # resync-on-update ("all visits"), and the org_id IDOR sweep on
    # modules/recurring/router.py (previously zero tenant scoping).
    tests/test_recurrence_series_scope.py
    # Property-level double-booking soft warning (Tier 1 roadmap item) +
    # the _overlaps() TypeError fix it uncovered in cleaner-availability.
    tests/test_scheduling_availability.py
    # Job public confirm-link (Tier 2 roadmap item): customer can view/confirm
    # a visit or request a reschedule (queued for staff, not auto-moved) via
    # the token appended to the reminder SMS.
    tests/test_job_public_confirm.py
    # Customer self-reschedule: open slots move instantly, busy slots (double-
    # book) hold for owner approval; recurring this/future scope. Plus the
    # professional-quote upgrades (Town — Service job titles + service policies).
    tests/test_job_self_reschedule.py
    tests/test_quote_professional.py
    # AI-draft a first reply (email/SMS) to a new lead/request + conversation
    # reply — exercises the deterministic fallback + {subject, message} shape.
    tests/test_ai_draft_lead.py
    # Customer portal: passwordless magic-link sign-in, strict email-scoped data
    # isolation, and portal/staff token boundary enforcement.
    tests/test_portal.py
    # Reschedule consistency: a moved visit carries the customer's confirm/manage
    # link and resets the stale confirmed/reminder flags.
    tests/test_reschedule_consistency.py
    # Comms list preview comes from the newest message via one batched query
    # (not by loading every message of every conversation).
    tests/test_comms_list_preview.py
    # Tier 3 roadmap: single-job endpoints now compute is_immediate_turnover/
    # booking/next_arrival (previously only GET /api/jobs did); the
    # turnover_lead_hours/turnover_lead_warning guardrail; and the per-property
    # iCal feed health rollup + turnovers_next_30d indicator.
    tests/test_turnover_lead_time.py
    # Tier 4 roadmap: POST /api/jobs/bulk-reschedule ("weather day" move) —
    # recurring occurrences go through the same reschedule-exception path as
    # a single "this visit only" edit, not a bare scheduled_date PATCH.
    tests/test_bulk_reschedule.py
    tests/test_recurring_inplace_move.py
    # Recurring "Ends" (Never / On date / After N occurrences), requested
    # directly from production feedback ("recurring like Google Calendar").
    tests/test_recurrence_ends.py
    # July-12 audit: quote email XSS (Jinja2 Template() defaults autoescape
    # off; a customer-typed address could inject live HTML/script into an
    # email this company's SMTP account sends).
    tests/test_quote_email_autoescape.py
    # July-12 audit backend hardening: require_role on field-definitions
    # PATCH/DELETE and quote-request POST (previously any authenticated
    # role could delete field definitions); JWT_SECRET fails closed at
    # import instead of minting a different random secret per worker
    # process; AI-agent WebSocket fails closed (not open) when
    # BRIGHTBASE_API_KEY is unset, matching the HTTP middleware.
    tests/test_july12_audit_hardening.py
    # Custom-quote guard moved into the pricing ENGINE (STR / commercial
    # return None estimates, breakdown.custom_quote=True) + the public
    # /instant-quote endpoint's custom_quote flag.
    tests/test_custom_quote_pricing.py
    # STR fabricated-estimate + fractional-bathroom guarantees on the
    # public booking submit path (was in tests/ but never enumerated here,
    # so CI silently skipped it — same gap as the #523 note above).
    tests/test_str_and_bathrooms.py
    # POST /api/booking/update — customer edits/cancels a website booking
    # by idempotency key (field updates, cancel → archived, 404 unknown).
    tests/test_booking_update.py
    # POST /api/booking/submit — customer confirmation SMS (Twilio lives here,
    # maineclean.co has no SMS): phone → SMS carrying the self-service manage
    # link, blank phone → no SMS, Twilio failure never breaks the 201.
    tests/test_booking_customer_sms.py
    # Cross-repo field contract (maineclean.co /book): arrivalWindow + inline
    # photos land on custom_fields (arrival_window/photos), photos filtered to
    # valid data:image/ URIs and capped at 3, and update changes arrival_window.
    tests/test_booking_arrival_photos.py
    # Name+address auto-merge: same name + service address with different
    # contact info collapses into one lead (in-window), stays separate
    # weeks later, and never merges across different addresses.
    tests/test_name_address_dedup.py
    # Cross-repo pricing parity: the Python engine must reproduce every row
    # in tests/pricing_vectors.json (generated from maineclean's canonical
    # @shared/pricing). Fails if the three engines drift apart.
    tests/test_pricing_parity.py
