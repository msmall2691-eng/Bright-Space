[pytest]
addopts = -q -p no:cacheprovider
# CI runs this curated, vetted-green set. Two flavours coexist here:
#   - Files under tests/ share fixtures via tests/conftest.py (schema-per-
#     session + auto API-key injection) and are the default place for new tests.
#   - A handful of root-level scripts (test_auth_middleware / test_complete_workflow
#     / test_phone_tail / test_quotes_integer) intentionally sit outside tests/
#     to bypass the auth autouse fixture, and are enumerated below.
#
# test_placeholder_absorption.py runs green but as a SEPARATE invocation because
# it bootstraps its own DB at import and can't share a process cleanly.
#
# Older E2E / workflow scripts that don't play with the shared fixtures moved
# to scripts/manual_tests/ — see the README there. Add new shareable test files
# under tests/, not here.
testpaths =
    # EVERY test under tests/, by glob — deliberately not a list.
    #
    # This was 194 hand-maintained entries. Four named files deleted at #367,
    # and pytest silently drops an entry that matches nothing (it only warns if
    # EVERY entry misses), so CI stayed green and said nothing. Fifty of the
    # 235 files here were listed nowhere and had never run — among them the
    # sweep asserting every external call has a timeout, the intake
    # idempotency + advisory-lock guardrail CLAUDE.md names, the token-refresh
    # test written so a booking is never lost to an expired session, and three
    # covering the recurrence drift `recurring-doctor` exists for.
    #
    # The failure mode is the quiet one: rename or move a test file and CI
    # stops running it, forever, with no feedback. The frontend already gets
    # this right — vitest.config.mjs globs, so all 90 files run.
    #
    # A genuinely broken file gets FIXED or DELETED, not omitted. Turning these
    # on found three real problems and each was dealt with at the root: four
    # async logo tests that pytest-asyncio (not installed) could never have
    # run, a Google scope assertion pinning `gmail.readonly` after the app
    # legitimately moved to modify+send, and a test importing the `Visit` model
    # deleted at #367.
    tests/
    # The four root-level scripts, still enumerated: they sit OUTSIDE tests/
    # precisely to bypass its auth autouse fixture, so no glob can reach them
    # without dragging that fixture along. Four names is a list worth keeping;
    # 194 was not. (test_placeholder_absorption.py is the fifth root-level file
    # and stays out on purpose — see the note above.)
    test_auth_middleware.py
    test_complete_workflow.py
    test_phone_tail.py
    test_quotes_integer.py
