<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BrightBase</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" />
    <!-- Mobile browser chrome — matches the paper/console theme roots in index.css so
         the iOS status bar and Android URL bar tint with the app instead of white. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0d0f" />
    <!-- Prevent iOS Safari from auto-linkifying anything that looks like a phone
         number into a tel: link — turns dates, IDs, and prices into blue underlines
         and breaks copy behavior. Also disables address auto-detection. -->
    <meta name="format-detection" content="telephone=no, address=no, email=no, date=no" />
    <!-- Add-to-Home-Screen basics: status-bar style + iOS home-screen icon (reuses
         the SVG data URI above rendered on a solid backdrop). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BrightBase" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%23f7f5ef'/><text x='50%25' y='55%25' font-size='120' text-anchor='middle' dominant-baseline='middle'>✨</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
